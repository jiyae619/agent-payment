# Astropods project for the model eval only (the public app runs on Render, not here).
# Run: ast project start   → see eval/README.md
spec: blueprint/v1
name: paypal-agent-eval

agent:
  build:
    context: .
    dockerfile: eval/Dockerfile

models:
  default:
    provider: gateway
    models: [claude-haiku-4-5, claude-haiku-5-5, claude-sonnet-5, gpt-5-6-luna, nova-lite, mistral-large-3]

dev:
  command: sh -c "node scripts/eval-entry.mts; echo 'Eval finished. Press Ctrl+C to stop.'; sleep infinity"
  watch: [eval, data, lib, scripts]
